name: Validate

# Runs on every push and PR — no cluster access required.
# Catches format, syntax, and lint errors before they reach main.

on:
  push:
  pull_request:

jobs:
  terraform:
    name: Terraform fmt & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      - name: Format check
        run: terraform -chdir=terraform/cluster-bootstrap fmt -check -recursive

      - name: Init (no backend)
        run: terraform -chdir=terraform/cluster-bootstrap init -backend=false

      - name: Validate
        run: terraform -chdir=terraform/cluster-bootstrap validate

  ansible:
    name: Ansible lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install ansible-core==2.17.* ansible-lint==24.*

      - name: Lint
        run: ansible-lint ansible/
        env:
          ANSIBLE_ROLES_PATH: ansible/roles

  yaml:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install yamllint

      - run: yamllint -c .yamllint.yml clusters/ ansible/ apps/
