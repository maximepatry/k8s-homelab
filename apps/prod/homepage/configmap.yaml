apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: prod
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
  settings.yaml: |
    title: Homelab
    background: https://images.unsplash.com/photo-1451187580459-43490279c0fa
    theme: dark
  custom.css: ""
  custom.js: ""
  bookmarks.yaml: |
    - Repo:
        - k8s-homelab:
            - abbr: GH
              href: https://github.com/maximepatry/k8s-homelab
  services.yaml: |
    - Homelab:
        - Grafana:
            href: http://grafana.homelab.local
            description: Metrics dashboards (Prometheus + Grafana)
            icon: grafana.png
  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - resources:
        backend: resources
        expanded: true
        cpu: true
        memory: true
        network: default
    - search:
        provider: duckduckgo
        target: _blank
  docker.yaml: ""
