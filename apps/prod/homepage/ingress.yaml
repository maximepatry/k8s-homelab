# TLS via the internal homelab CA (clusters/homelab/infrastructure/cert-manager-ca)
# - not Let's Encrypt, homelab.local isn't a real domain. Browser trusts this
# once the root CA is imported, see docs/networking.md.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homepage
  namespace: prod
  labels:
    app.kubernetes.io/name: homepage
  annotations:
    cert-manager.io/cluster-issuer: homelab-ca
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - "homepage.homelab.local"
      secretName: homepage-tls
  rules:
    - host: "homepage.homelab.local"
      http:
        paths:
          - path: "/"
            pathType: Prefix
            backend:
              service:
                name: homepage
                port:
                  number: 3000
