# Two AppProjects enforce prod/stage isolation at the ArgoCD level: an
# Application in the "stage" project cannot deploy into namespace "prod"
# (or vice versa), regardless of what its manifests say.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: prod
  namespace: argocd
spec:
  description: Production workloads
  sourceRepos:
    - https://github.com/maximepatry/k8s-homelab
  destinations:
    - server: https://kubernetes.default.svc
      namespace: prod
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    # Homepage (apps/prod/homepage) needs cluster-wide read access to show
    # pods/nodes/ingresses across all namespaces for its "mode: cluster"
    # widget - that requires a ClusterRole/ClusterRoleBinding, which are
    # cluster-scoped and would otherwise be blocked/pruned by this
    # AppProject. Whitelisted deliberately, not a general RBAC loosening.
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: stage
  namespace: argocd
spec:
  description: Staging workloads
  sourceRepos:
    - https://github.com/maximepatry/k8s-homelab
  destinations:
    - server: https://kubernetes.default.svc
      namespace: stage
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
