apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.longhorn.io
    chart: longhorn
    targetRevision: "1.7.*"
    helm:
      valuesObject:
        defaultSettings:
          defaultReplicaCount: 2
          storageMinimalAvailablePercentage: 10
        persistence:
          defaultClass: true
          defaultClassReplicaCount: 2
        preUpgradeChecker:
          # The chart's own docs recommend this for ArgoCD/GitOps installs:
          # the pre-upgrade check is a PreSync hook Job that assumes the
          # longhorn-service-account it runs as already exists - true on a
          # real `helm upgrade`, not on ArgoCD's first sync of a fresh
          # install (PreSync hooks run before the regular Sync-phase
          # ServiceAccount, so the Job can never actually schedule). The
          # Application-level `SkipHooks=true` syncOption does not actually
          # work around this in the ArgoCD version this cluster runs
          # (v2.13.4 - the option is accepted but silently has no effect),
          # so disable the hook at the chart level instead.
          jobEnabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
