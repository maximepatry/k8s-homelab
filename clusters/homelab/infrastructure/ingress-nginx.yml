apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: "4.11.*"
    helm:
      valuesObject:
        controller:
          service:
            type: LoadBalancer   # MetalLB will assign an IP from your pool
          admissionWebhooks:
            enabled: false   # avoids the chart's PreSync hook Job (cert-gen)
            # hitting a fast-reconcile loop in this ArgoCD version where it
            # never gets a chance to complete before being re-deleted - see
            # docs/cluster-admin.md, "Forcing a stuck sync". Not needed for
            # a homelab; this only disables Ingress spec validation.
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
