apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-homelab-overview
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  homelab-overview.json: |
    {
      "id": null,
      "uid": "homelab-overview",
      "title": "Homelab Overview",
      "description": "host1/host2/host3 bare-metal cluster - node resource usage, pod/namespace counts, PVC usage. See docs/monitoring.md.",
      "tags": ["homelab", "kubernetes"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-6h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 0
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Nodes Ready",
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "targets": [
            {
              "expr": "sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"})",
              "legendFormat": "ready"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 3 }
                ]
              }
            }
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Pods Running",
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "targets": [
            { "expr": "sum(kube_pod_status_phase{phase=\"Running\"})", "legendFormat": "running" }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Pods Not Ready",
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "targets": [
            {
              "expr": "sum(kube_pod_status_phase{phase=~\"Pending|Failed|Unknown\"})",
              "legendFormat": "not ready"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              }
            }
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Active Namespaces",
          "gridPos": { "h": 4, "w": 4, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "targets": [
            { "expr": "count(kube_namespace_status_phase{phase=\"Active\"})", "legendFormat": "namespaces" }
          ]
        },
        {
          "id": 5,
          "type": "stat",
          "title": "ArgoCD Apps OutOfSync",
          "gridPos": { "h": 4, "w": 4, "x": 16, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "targets": [
            {
              "expr": "sum(argocd_app_info{sync_status!=\"Synced\"}) or vector(0)",
              "legendFormat": "out of sync"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 1 }
                ]
              }
            }
          },
          "description": "Only populated if the ArgoCD ServiceMonitor is added later - see docs/monitoring.md."
        },
        {
          "id": 6,
          "type": "stat",
          "title": "PVCs Bound",
          "gridPos": { "h": 4, "w": 4, "x": 20, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "targets": [
            { "expr": "sum(kube_persistentvolumeclaim_status_phase{phase=\"Bound\"})", "legendFormat": "bound" }
          ]
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "CPU Usage per Node",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100 } },
          "targets": [
            {
              "expr": "100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])))",
              "legendFormat": "{{instance}}"
            }
          ]
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Memory Usage per Node",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100 } },
          "targets": [
            {
              "expr": "100 * (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes))",
              "legendFormat": "{{instance}}"
            }
          ]
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "Root Filesystem Usage per Node",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100 } },
          "targets": [
            {
              "expr": "100 - (100 * node_filesystem_avail_bytes{mountpoint=\"/\",fstype!=\"tmpfs\"} / node_filesystem_size_bytes{mountpoint=\"/\",fstype!=\"tmpfs\"})",
              "legendFormat": "{{instance}}"
            }
          ]
        },
        {
          "id": 13,
          "type": "timeseries",
          "title": "Longhorn Filesystem Usage per Node (/var/lib/longhorn)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100 } },
          "targets": [
            {
              "expr": "100 - (100 * node_filesystem_avail_bytes{mountpoint=\"/var/lib/longhorn\"} / node_filesystem_size_bytes{mountpoint=\"/var/lib/longhorn\"})",
              "legendFormat": "{{instance}}"
            }
          ]
        },
        {
          "id": 14,
          "type": "timeseries",
          "title": "Network Traffic per Node (physical NIC)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 20 },
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "fieldConfig": { "defaults": { "unit": "Bps" } },
          "targets": [
            {
              "expr": "rate(node_network_receive_bytes_total{device=~\"en.*\"}[5m])",
              "legendFormat": "{{instance}} {{device}} rx"
            },
            {
              "expr": "rate(node_network_transmit_bytes_total{device=~\"en.*\"}[5m])",
              "legendFormat": "{{instance}} {{device}} tx"
            }
          ]
        },
        {
          "id": 15,
          "type": "barchart",
          "title": "Running Pods per Namespace",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 20 },
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "targets": [
            {
              "expr": "sum by (namespace) (kube_pod_status_phase{phase=\"Running\"})",
              "legendFormat": "{{namespace}}",
              "format": "table",
              "instant": true
            }
          ]
        },
        {
          "id": 16,
          "type": "timeseries",
          "title": "PVC Usage",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 28 },
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100 } },
          "targets": [
            {
              "expr": "100 * kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes",
              "legendFormat": "{{namespace}}/{{persistentvolumeclaim}}"
            }
          ]
        }
      ]
    }
