---
- name: Check if node is already joined
  stat:
    path: /etc/kubernetes/kubelet.conf
  register: kubelet_conf

- name: Join cluster
  command: "{{ hostvars['localhost']['kubeadm_join_command'] }}"
  when: not kubelet_conf.stat.exists

- name: Label node as worker
  # kubelet registers under the OS hostname (hostN.lab.local from
  # kickstart), not the bare inventory_hostname - see the matching note in
  # control-plane/tasks/main.yml.
  command: >
    kubectl --kubeconfig /home/foo/.kube/config
    label node {{ inventory_hostname }}.lab.local node-role.kubernetes.io/worker=worker --overwrite
  delegate_to: "{{ groups['control_plane'][0] }}"
  become: false
