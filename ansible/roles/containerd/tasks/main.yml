---
- name: Add Docker CE repo (provides containerd.io for Rocky)
  get_url:
    url: https://download.docker.com/linux/centos/docker-ce.repo
    dest: /etc/yum.repos.d/docker-ce.repo

- name: Install containerd
  dnf:
    name: "containerd.io"
    state: present

- name: Create containerd config directory
  file:
    path: /etc/containerd
    state: directory

- name: Generate default containerd config
  # No `creates:` guard here on purpose - the containerd.io RPM ships its
  # own minimal /etc/containerd/config.toml template with
  # `disabled_plugins = ["cri"]` (meant for plain Docker use, not
  # Kubernetes). Gating on that file already existing means this command
  # never actually runs and CRI stays disabled - kubeadm then fails at
  # preflight with "unknown service runtime.v1.RuntimeService". Regenerating
  # the real default (CRI enabled) on every run is safe: the next task
  # patches SystemdCgroup on top of it in the same play.
  shell: containerd config default > /etc/containerd/config.toml
  notify: restart containerd

- name: Enable SystemdCgroup in containerd
  replace:
    path: /etc/containerd/config.toml
    regexp: 'SystemdCgroup = false'
    replace: 'SystemdCgroup = true'
  notify: restart containerd

- name: Enable and start containerd
  systemd:
    name: containerd
    enabled: true
    state: started
