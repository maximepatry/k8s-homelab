---
- name: Install base packages
  dnf:
    name:
      - curl
      - ca-certificates
      - gnupg2
      - iscsi-initiator-utils   # required by Longhorn
      - nfs-utils               # required by Longhorn
      - iproute-tc              # required by Cilium
      - conntrack-tools         # required by kubeadm preflight checks
    state: present

- name: Enable and start iscsid
  systemd:
    name: iscsid
    enabled: true
    state: started

- name: Disable swap
  command: swapoff -a
  when: ansible_swaptotal_mb > 0

- name: Remove swap from fstab
  lineinfile:
    path: /etc/fstab
    regexp: '\sswap\s'
    state: absent

- name: Disable zram-generator (Rocky Linux 9 swap via zram)
  systemd:
    name: "{{ item }}"
    enabled: false
    state: stopped
    masked: true
  loop:
    - swap.target
  ignore_errors: true

- name: Load required kernel modules
  modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter

- name: Persist kernel modules
  copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter

- name: Set sysctl params for k8s networking
  sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/k8s.conf
    reload: true
  loop:
    - { key: net.bridge.bridge-nf-call-iptables,  value: "1" }
    - { key: net.bridge.bridge-nf-call-ip6tables, value: "1" }
    - { key: net.ipv4.ip_forward,                 value: "1" }

# firewalld is enabled by default on Rocky — disable it; Cilium manages eBPF rules
- name: Disable firewalld
  systemd:
    name: firewalld
    enabled: false
    state: stopped
  ignore_errors: true

- name: Set SELinux to permissive
  selinux:
    policy: targeted
    state: permissive

- name: Persist SELinux permissive
  replace:
    path: /etc/selinux/config
    regexp: '^SELINUX=enforcing'
    replace: 'SELINUX=permissive'
