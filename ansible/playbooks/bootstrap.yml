---
- name: Common setup on all nodes
  hosts: k8s_cluster
  roles:
    - role: common
      tags: common
    - role: storage
      tags: storage
    - role: containerd
      tags: containerd
    - role: kubeadm
      tags: kubeadm

- name: Initialize control plane
  hosts: control_plane
  roles:
    - role: control-plane
      tags: control-plane

- name: Join workers
  hosts: workers
  roles:
    - role: worker
      tags: worker
